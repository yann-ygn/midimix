# The Midimix editor's MPC page: one tab. Edited by hand or in the skin studio
# (mpc-vst-plugins/tools/studio.py serve plugin/layout.conf --params plugin/params.json).
# Top: the status line and a hint. Then the 8 strips of the bank midimixd shows, each in its track's colour (a
# picture per strip, colour_<n>) with its name. Left: the 7 rows (a list: tap one, or touch one of its controls on
# the Midimix, to pick it). Right: the picked row's targets, knob and fader ones or button ones (when=rowkind).
# Dracula palette, as torpedo's.
