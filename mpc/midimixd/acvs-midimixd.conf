[Service]
# midimixd (installed as /etc/systemd/system/acvs.service.d/91-midimixd.conf by its install.sh):
# start midimixd.service whenever MPC starts. --no-block: MPC doesn't wait for it; "-": MPC starts
# even if this fails. Nothing else of MPC's start changes.
ExecStartPost=-/bin/systemctl --no-block start midimixd.service
